# fly.toml app configuration file generated for honovel on 2026-09-17T17:14:01+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'honovel'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_HOST = '0.0.0.0'
  APP_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
