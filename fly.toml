# fly.toml app configuration file generated for honovel on 2026-09-17T07:44:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'honovel'
primary_region = 'ams'

[build]

[env]
  APP_PORT = '8080'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
